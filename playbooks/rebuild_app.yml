---
- name: Rebuild the application with the Lightwell-patched dependency
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/main.yml"
  vars:
    lw_default_advisory_id: LW-2026-00412
    lw_default_app: payments-api
    lw_default_nvr: "2.2.3+lightwell1"
    lw_default_package: urllib3
  tasks:
    - name: Apply extra-var defaults
      ansible.builtin.set_fact:
        advisory_id: "{{ advisory_id | default(lw_default_advisory_id, true) }}"
        target_app: "{{ target_app | default(lw_default_app, true) }}"
        patched_version: "{{ patched_version | default(lw_default_nvr, true) }}"
        package_name: "{{ package_name | default(lw_default_package, true) }}"
        lightwell_cache: "{{ lightwell_cache | default(lightwell_work_dir ~ '/cache/' ~ (advisory_id | default(lw_default_advisory_id, true)), true) }}"

    - name: Require a known application
      ansible.builtin.assert:
        that:
          - target_app in demo_apps
        fail_msg: Unknown application {{ target_app }}

    - name: Create build workspace
      ansible.builtin.file:
        path: "{{ lightwell_work_dir }}/builds/{{ target_app }}"
        state: directory
        mode: "0755"

    - name: Load original application manifest
      ansible.builtin.slurp:
        src: "{{ demo_apps[target_app].requirements }}"
      register: __manifest

    - name: Rewrite Python requirements with the Lightwell NVR
      ansible.builtin.copy:
        dest: "{{ lightwell_work_dir }}/builds/{{ target_app }}/requirements.lock"
        mode: "0644"
        content: |
          # Generated by Lightwell patch pipeline
          # advisory: {{ advisory_id }}
          # original {{ package_name }} replaced with signed Lightwell backport
          flask==3.0.3
          urllib3=={{ patched_version }}
          httpx==0.27.2
      when: demo_apps[target_app].language == "python"

    - name: Rewrite Maven coordinates with the Lightwell NVR
      ansible.builtin.copy:
        dest: "{{ lightwell_work_dir }}/builds/{{ target_app }}/pom.xml"
        mode: "0644"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <project>
            <modelVersion>4.0.0</modelVersion>
            <artifactId>{{ target_app }}</artifactId>
            <version>lightwell-{{ advisory_id }}</version>
            <dependencies>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-text</artifactId>
                <version>{{ patched_version }}</version>
              </dependency>
            </dependencies>
          </project>
      when: demo_apps[target_app].language == "java"

    - name: Compose patched runtime SBOM
      ansible.builtin.set_fact:
        lw_patched_sbom:
          app: "{{ target_app }}"
          advisory_id: "{{ advisory_id }}"
          built_at: "{{ now(utc=true).isoformat() }}"
          environment: build
          components:
            - name: "{{ package_name }}"
              version: "{{ patched_version }}"
              lightwell: true
              cache: "{{ lightwell_cache }}"

    - name: Write patched runtime SBOM
      ansible.builtin.copy:
        dest: "{{ lightwell_work_dir }}/builds/{{ target_app }}/sbom.json"
        mode: "0644"
        content: "{{ lw_patched_sbom | to_nice_json }}\n"

    - name: Compose build artifact
      ansible.builtin.set_fact:
        lw_build_artifact:
          app: "{{ target_app }}"
          image: "{{ target_app }}:{{ advisory_id | lower }}"
          advisory_id: "{{ advisory_id }}"
          patched_dependency: "{{ package_name }}=={{ patched_version }}"
          status: rebuilt
          promoted_to: build

    - name: Write build artifact
      ansible.builtin.copy:
        dest: "{{ lightwell_work_dir }}/builds/{{ target_app }}/artifact.json"
        mode: "0644"
        content: "{{ lw_build_artifact | to_nice_json }}\n"

    - name: Show rebuild result
      ansible.builtin.debug:
        msg:
          - "Rebuilt {{ target_app }} as {{ target_app }}:{{ advisory_id | lower }}"
          - "Pinned {{ package_name }}=={{ patched_version }} from Lightwell cache"
          - "Artifact {{ lightwell_work_dir }}/builds/{{ target_app }}/artifact.json"

    - name: Publish rebuild artifacts
      ansible.builtin.set_stats:
        data:
          build_dir: "{{ lightwell_work_dir }}/builds/{{ target_app }}"
          artifact_path: "{{ lightwell_work_dir }}/builds/{{ target_app }}/artifact.json"
          image_tag: "{{ target_app }}:{{ advisory_id | lower }}"
          rebuild_status: rebuilt
        per_host: false
